<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Gốc tọa độ, Zoom và Pan</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene: Tạo cảnh
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee); // Đặt màu nền cho dễ nhìn

        // Thêm ánh sáng môi trường để các vật thể không bị đen hoàn toàn
        const ambientLight = new THREE.AmbientLight(0xffffff, 1); // Ánh sáng trắng, cường độ 1
        scene.add(ambientLight);

        // Thêm ánh sáng định hướng (như mặt trời) để tạo bóng và chiều sâu
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5); // Cường độ mạnh hơn một chút
        directionalLight.position.set(5, 10, 7); // Đặt vị trí nguồn sáng
        scene.add(directionalLight);

        // 2. Camera: Tạo camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        camera.position.y = 2;
        camera.position.x = 2;

        // 3. Renderer: Tạo renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. OrbitControls: Thêm điều khiển camera (zoom, pan)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Tạo cảm giác mượt mà khi di chuyển
        controls.dampingFactor = 0.05;

        // 5. Geometry & Material: Thêm một khối lập phương để nhìn cho rõ
        //const geometry = new THREE.BoxGeometry(1, 1, 1);
        //const material = new THREE.MeshNormalMaterial(); // Vật liệu có màu sắc theo pháp tuyến
        //const cube = new THREE.Mesh(geometry, material);
        //scene.add(cube);

        // 6. AxesHelper: Thêm gốc tọa độ
        const axesHelper = new THREE.AxesHelper(3); // Tham số là độ dài của mỗi trục
        scene.add(axesHelper);

        //Load json object
        window.loadObjectFromJsonString = function (jsonString) {
            if (!scene) {
                alert("Three.js scene chưa được khởi tạo.");
                return;
            }
            try {
                const jsonData = JSON.parse(jsonString);
                const loader = new THREE.ObjectLoader();
                const loadedObject = loader.parse(jsonData);
                scene.add(loadedObject);
            } catch (error) {
                alert("Lỗi khi xử lý chuỗi JSON: ", error);
            }
        }

        // 7. Animation Loop: Vòng lặp để render cảnh
        function animate() {
            requestAnimationFrame(animate);

            // Cập nhật controls trong mỗi khung hình
            controls.update();

            renderer.render(scene, camera);
        }

        // Xử lý khi cửa sổ trình duyệt thay đổi kích thước
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
