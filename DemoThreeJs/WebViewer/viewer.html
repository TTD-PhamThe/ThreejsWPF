<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Gốc tọa độ, Zoom và Pan</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene: Tạo cảnh
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xeeeeee); // Đặt màu nền cho dễ nhìn

        // Thêm ánh sáng môi trường để các vật thể không bị đen hoàn toàn
        const ambientLight = new THREE.AmbientLight(0xffffff, 1); // Ánh sáng trắng, cường độ 1
        scene.add(ambientLight);

        // Thêm ánh sáng định hướng (như mặt trời) để tạo bóng và chiều sâu
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5); // Cường độ mạnh hơn một chút
        directionalLight.position.set(5, 10, 7); // Đặt vị trí nguồn sáng
        scene.add(directionalLight);

        // 2. Camera: Tạo camera
        //const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 20000;
        const camera = new THREE.OrthographicCamera(
            -frustumSize * aspect / 2,   // left
            frustumSize * aspect / 2,   // right
            10000,            // top
            -frustumSize / 2,            // bottom
            0.1, 1000000
        );
        camera.position.set(-20000, -20000, 20000); // nhìn chéo
        camera.up.set(0, 0, 1);
        camera.lookAt(0, 0, 0);

        // 3. Renderer: Tạo renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. OrbitControls: Thêm điều khiển camera (zoom, pan)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Tạo cảm giác mượt mà khi di chuyển
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.target.set(0, 0, 0);
        controls.update();

        // 6. AxesHelper: Thêm gốc tọa độ
        const axesHelper = new THREE.AxesHelper(100000); // Tham số là độ dài của mỗi trục
        scene.add(axesHelper);

        // 7. Animation Loop: Vòng lặp để render cảnh
        function animate() {
            requestAnimationFrame(animate);

            // Cập nhật controls trong mỗi khung hình
            controls.update();

            renderer.render(scene, camera);
        }

        // Xử lý khi cửa sổ trình duyệt thay đổi kích thước
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        //Load font
        window.loadFontFromJsonString = function (fontJsonString, fontUuid) {
            // Đảm bảo loader được khởi tạo nếu nó không phải là biến toàn cục
            if (!window.objectLoader) {
                window.objectLoader = new THREE.ObjectLoader();
            }
            try {
                const fontData = JSON.parse(fontJsonString);
                // Chuẩn bị cấu trúc JSON tối thiểu để ObjectLoader nhận dạng và lưu trữ phông chữ
                const fontRegistrationData = {
                    fonts: [
                        {
                            uuid: fontUuid,
                            type: 'Font',
                            data: fontData // Dữ liệu phông chữ thực tế
                        }
                    ]
                };
                // Sử dụng parse để đăng ký font vào bộ nhớ cache nội bộ của loader
                window.objectLoader.parse(fontRegistrationData);
                console.log(`Đã đăng ký phông chữ thành công với UUID: ${fontUuid}`);
            } catch (error) {
                console.error("Lỗi khi đọc hoặc đăng ký dữ liệu phông chữ JSON:", error);
                alert("Lỗi khi tải dữ liệu phông chữ: " + error.message);
            }
        }

        //Load json object
        window.loadObjectFromJsonString = function (jsonString) {
            // Đảm bảo loader được khởi tạo nếu nó không phải là biến toàn cục
            if (!window.objectLoader) {
                window.objectLoader = new THREE.ObjectLoader();
            }
            if (!scene) {
                console.log("Three.js scene chưa được khởi tạo.");
                return;
            }
            try {
                const jsonData = JSON.parse(jsonString);
                const loadedObject = window.objectLoader.parse(jsonData);
                scene.add(loadedObject);
            } catch (error) {
                console.log("Loi doc file json", error);
                alert(error);
            }
        }
    </script>
</body>
</html>
